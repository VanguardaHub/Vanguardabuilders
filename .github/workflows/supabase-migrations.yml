name: Supabase Migrations

# Aplica as migrations de supabase/migrations/ no projeto Supabase próprio
# (supabase db push) a cada push em main que altere as migrations.
#
# PRÉ-REQUISITO: a pasta supabase/ (config.toml + migrations/) precisa existir
# versionada no repositório. Hoje ela está apenas dentro de VanguardaBuilder.zip
# — ver MIGRACAO.md, seção "Desempacotar o código-fonte".
#
# Secrets necessários (Settings > Secrets and variables > Actions):
#   SUPABASE_ACCESS_TOKEN -> https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF  -> ref do projeto novo (ex.: abcd... .supabase.co)
#   SUPABASE_DB_PASSWORD  -> senha do banco do projeto novo

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push
